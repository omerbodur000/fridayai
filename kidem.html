<!DOCTYPE html>
<html lang="tr" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MERCEK AI - Kıdem Tazminatı Hesaplama</title>
    
    <link rel="icon" href="logo/logo1.png" type="image/png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <script>
        // Tema ayarını önceden yükle
        const savedTheme = localStorage.getItem('theme') || 'dark';
        document.documentElement.setAttribute('data-bs-theme', savedTheme);
    </script>

    <style>
        body {
            /* Arka plan temaya göre değişecek, ancak kart ve menü sabit kalacak */
            background-color: var(--bs-body-bg);
            color: var(--bs-body-color);
            transition: background-color 0.3s ease, color 0.3s ease;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            overflow-x: hidden;
        }

        /* Sağ Menü (Sidebar) Sabit Karanlık Kalacak */
        .sidebar {
            background: linear-gradient(180deg, #1e2227 0%, #121418 100%) !important;
            box-shadow: -4px 0 20px rgba(0, 0, 0, 0.4);
            min-height: 100vh;
            border-left: 1px solid rgba(255,255,255,0.05);
        }
        @media (min-width: 769px) {
            .sidebar { margin: 0 0 0 auto; width: 280px !important; }
        }
        .sidebar .nav-link {
            border-radius: 12px;
            padding: 12px 16px;
            transition: all 0.3s ease;
            color: #adb5bd !important; /* Her modda görünür kalması için */
        }
        .sidebar .nav-link:hover, .sidebar .nav-link.active {
            background-color: rgba(255, 255, 255, 0.08) !important;
            color: #ffffff !important;
            transform: translateX(4px);
        }
        @media (max-width: 768px) {
            .sidebar { display: none !important; }
            .sidebar.show { display: flex !important; }
        }

        /* Modern Hesaplama Kartı Sabit Karanlık Kalacak */
        .modern-card {
            background: linear-gradient(135deg, rgba(33, 37, 41, 0.95) 0%, rgba(20, 22, 25, 0.98) 100%) !important;
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            padding: 3rem 2rem;
            color: #ffffff; /* Metinler her zaman beyaz kalmalı */
        }

        /* Modern Input Alanları */
        .input-group-text {
            background-color: rgba(0, 0, 0, 0.3) !important;
            border: 1px solid rgba(255, 255, 255, 0.1) !important;
            border-right: none !important;
            color: #adb5bd !important;
            border-radius: 12px 0 0 12px !important;
        }
        .modern-input {
            background-color: rgba(0, 0, 0, 0.3) !important;
            border: 1px solid rgba(255, 255, 255, 0.1) !important;
            border-left: none !important;
            color: #fff !important;
            border-radius: 0 12px 12px 0 !important;
            transition: all 0.3s;
        }
        .modern-input:focus {
            background-color: rgba(0, 0, 0, 0.5) !important;
            box-shadow: none !important;
            border-color: #0d6efd !important;
        }
        .input-group:focus-within .input-group-text {
            border-color: #0d6efd !important;
            color: #0d6efd !important;
        }

        /* Premium Hesapla Butonu */
        .calc-btn {
            background: linear-gradient(45deg, #0d6efd, #6610f2);
            border: none;
            border-radius: 12px;
            font-size: 1.1rem;
            letter-spacing: 1px;
            transition: all 0.3s ease;
        }
        .calc-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(13, 110, 253, 0.4);
        }

        /* Sonuç Alanı */
        .result-box {
            background: linear-gradient(135deg, rgba(13, 110, 253, 0.15) 0%, rgba(102, 16, 242, 0.15) 100%);
            border: 1px solid rgba(13, 110, 253, 0.3);
            border-radius: 16px;
        }
    </style>
</head>
<body>

<div class="container-fluid min-vh-100 p-0">
    <div class="row h-100 g-0">

        <div class="col-12 col-md-9 d-flex flex-column p-4 p-md-5 mx-auto relative">
            
            <div class="d-md-none mb-3 w-100 text-end pe-2">
                <button class="btn btn-secondary rounded-pill px-3 border-secondary border-opacity-25" onclick="menuAcKapa()">
                    <i class="bi bi-list me-1"></i> Menü
                </button>
            </div>

            <div class="d-flex align-items-center mb-5">
                <img src="logo/logo1.png" alt="Mercek AI" class="me-3" style="width: 50px; height: 50px;">
                <div class="d-flex flex-column align-items-center mt-1">
                    <h3 class="fw-bold mb-0 lh-1" style="letter-spacing: 1px;">MERCEK AI</h3>
                    <span class="text-secondary text-center" style="font-size: 0.90rem; margin-top: 4px;">İK Çözümleri</span>
                </div>
            </div>

            <div class="flex-grow-1 d-flex align-items-center justify-content-center">
                <div class="w-100" style="max-width: 550px;">
                    <div class="modern-card">
                        <div class="text-center mb-5">
                            <h3 class="fw-bold text-white mb-2">Kıdem Tazminatı</h3>
                            <p class="text-white-50 small mb-0">Brüt maaşınızı ve çalışma sürenizi girerek tahmini tazminatınızı anında hesaplayın.</p>
                        </div>
                        
                        <div class="mb-4">
                            <label for="brutMaas" class="form-label text-light fw-medium small text-uppercase letter-spacing-1">Brüt Maaşınız (Aylık)</label>
                            <div class="input-group input-group-lg">
                                <span class="input-group-text"><span class="fs-5 fw-medium">₺</span></span>
                                <input type="text" id="brutMaas" class="form-control modern-input" oninput="formatTutar(this)" placeholder="Örn: 35.058,58">
                            </div>
                        </div>

                        <div class="mb-4">
                            <label for="calismaYil" class="form-label text-light fw-medium small text-uppercase letter-spacing-1">Çalışma Süreniz (Yıl)</label>
                            <div class="input-group input-group-lg">
                                <span class="input-group-text"><i class="bi bi-calendar-check fs-5"></i></span>
                                <input type="number" id="calismaYil" class="form-control modern-input" placeholder="Örn: 5">
                            </div>
                        </div>

                        <div class="text-center mb-4 mt-2">
                            <div class="d-inline-flex align-items-center bg-dark bg-opacity-50 border border-secondary border-opacity-25 rounded-pill px-4 py-2">
                                <i class="bi bi-info-circle text-primary me-2"></i>
                                <span class="text-white-50 small me-1">Güncel Kıdem Tavanı:</span>
                                <span id="guncelTavanGosterge" class="fw-bold text-light">Yükleniyor...</span>
                            </div>
                        </div>

                        <button class="calc-btn text-white w-100 py-3 fw-bold mb-4" onclick="hesaplaKidem()">
                            <i class="bi bi-calculator me-2"></i> TAZMİNATI HESAPLA
                        </button>

                        <div id="sonucAlani" class="result-box p-4 text-center d-none">
                            <h6 class="mb-2 text-white-50 text-uppercase small">Tahmini Hak Ediş</h6>
                            <h1 class="fw-bold text-white mb-0" id="kidemSonuc" style="text-shadow: 0 2px 10px rgba(13,110,253,0.3);">0,00 TL</h1>
                        </div>
                    </div>
                </div>
            </div>
            
        </div>

        <div id="sidebar_cubugu" class="col-12 col-md-3 sidebar d-flex flex-column p-4 justify-content-between">
            <div>
                <div class="d-flex align-items-center mb-5 ps-2">
                    <img src="logo/logo1.png" alt="Mercek AI" class="me-2" style="width: 28px; height: 28px;">
                    <h5 class="mb-0 text-white fw-bold">Menü</h5>
                </div>

                <ul class="nav flex-column gap-2">
                    <li class="nav-item">
                        <a class="nav-link d-flex align-items-center" href="index.html">
                            <i class="bi bi-house-door me-3 fs-5"></i>Ana Sayfa
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active text-white bg-primary bg-opacity-25 d-flex align-items-center" href="kidem.html">
                            <i class="bi bi-calculator me-3 fs-5"></i>Kıdem Hesaplama
                        </a>
                    </li>
                </ul>
            </div>

            <div class="mt-auto pt-4 border-top border-secondary border-opacity-25">
                <div class="form-check form-switch ms-2 d-flex align-items-center">
                    <input class="form-check-input" type="checkbox" id="darkModeSwitch" onchange="temaDegistir()" style="transform: scale(1.2); cursor: pointer;">
                    <label class="form-check-label ms-2" for="darkModeSwitch" style="color: #adb5bd; cursor: pointer;">Karanlık Mod</label>
                </div>
            </div>
        </div>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/k-script.js"></script>

</body>
</html>
