<!DOCTYPE html>
<html lang="tr" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MERCEK AI - Yönetim Paneli</title>
    
    <link rel="icon" href="logo/logo1.png" type="image/png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <script>
        document.documentElement.setAttribute('data-bs-theme', 'dark');
        localStorage.setItem('theme', 'dark');
    </script>

    <style>
        body {
            background-color: #1a1d21;
            overflow-x: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }
        .sidebar {
            background: #212529;
            box-shadow: -4px 0 15px rgba(0, 0, 0, 0.3);
            min-height: 100vh;
            border-left: 1px solid rgba(255,255,255,0.05);
        }
        .main-card {
            background-color: #212529;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.05);
        }
        
        .table-dark {
            --bs-table-bg: transparent;
            --bs-table-border-color: rgba(255,255,255,0.05);
        }
        
        .table th {
            font-size: 0.95rem;
            color: #adb5bd !important;
            border-bottom: 2px solid rgba(255,255,255,0.05);
            padding-bottom: 12px;
        }

        .table td {
            vertical-align: middle;
            padding: 16px 8px;
        }

        @media (min-width: 769px) {
            .sidebar {
                margin: 0 0 0 auto;
                width: 280px !important; 
                min-height: 100vh !important;
            }
        }

        .sidebar .nav-link {
            border-radius: 8px;
            padding: 12px 16px;
            transition: all 0.2s ease-in-out;
            color: #adb5bd;
        }

        .sidebar .nav-link:hover {
            background-color: rgba(255, 255, 255, 0.05);
            color: #ffffff !important;
        }

        .sidebar .logout-link:hover {
            background-color: rgba(220, 53, 69, 0.15) !important;
            color: #dc3545 !important;
        }

        @media (max-width: 768px) {
            .sidebar { display: none !important; }
            .sidebar.show { display: flex !important; }
        }
    </style>
</head>
<body>

<div class="container-fluid min-vh-100 p-0">
    <div class="row h-100 g-0">

        <div class="col-12 col-md-9 p-4 p-md-5 d-flex flex-column text-start mx-auto">
            
            <div class="d-md-none mb-3 w-100 text-end pe-2">
                <button class="btn btn-dark rounded-pill px-3" onclick="menuAcKapa()">
                    <i class="bi bi-list me-1"></i> Menü
                </button>
            </div>

            <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-3">
                <div class="d-flex align-items-center">
                    <img src="logo/logo1.png" alt="Mercek AI" class="me-3" style="width: 45px; height: 45px;">
                    <div class="d-flex flex-column justify-content-center">
                        <h3 class="fw-bold mb-0 text-white lh-1">MERCEK AI</h3>
                        <span class="text-secondary mt-1" style="font-size: 0.90rem;">Yönetim Paneli</span>
                    </div>
                </div>
                
                <div>
                    <button class="btn btn-danger rounded-pill px-4 me-2" onclick="tumMesajlariSil()">Tümünü Sil</button>
                    <a href="/" class="btn btn-outline-light rounded-pill px-4">Ana Sayfaya Dön</a>
                </div>
            </div>

            <div class="main-card shadow-sm p-4 mt-2">
                <h5 class="fw-bold text-white mb-4">İletişim Mesajları</h5>
                
                <div class="table-responsive">
                    <table class="table table-dark table-hover mb-0">
                        <thead>
                            <tr>
                                <th class="ps-3" style="width: 20%;">Tarih</th>
                                <th style="width: 30%;">Gönderen</th>
                                <th style="width: 30%;">Konu</th>
                                <th class="text-end pe-3" style="width: 20%;">Detaylar</th>
                            </tr>
                        </thead>
                        <tbody id="mesajlar_alani">
                            </tbody>
                    </table>
                </div>
            </div>

        </div>

        <div id="sidebar_cubugu" class="col-12 col-md-3 sidebar d-flex flex-column p-4 justify-content-between">
            <div>
                <div class="d-flex align-items-center mb-4 ps-2">
                    <img src="logo/logo1.png" alt="Mercek AI" class="me-2" style="width: 28px; height: 28px;">
                    <h5 class="mb-0 text-white fw-bold">Yönetim Paneli</h5>
                </div>

                <ul class="nav flex-column gap-1">
                    <li class="nav-item">
                        <a class="nav-link d-flex align-items-center" href="index.html"><i class="bi bi-house-door me-3 fs-5"></i>Ana Sayfa</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link d-flex align-items-center text-white bg-secondary bg-opacity-25" href="yonetim.html"><i class="bi bi-bookmark-star-fill me-3 fs-5"></i>Yönetim Paneli</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link d-flex align-items-center justify-content-between" data-bs-toggle="collapse" href="#tavanAltMenu" role="button" aria-expanded="false">
                            <div><i class="bi bi-currency-exchange me-3 fs-5"></i>Tavan Güncelleme</div>
                            <i class="bi bi-chevron-down small"></i>
                        </a>
                        <div class="collapse" id="tavanAltMenu">
                            <div class="p-3 bg-dark bg-opacity-50 border border-secondary border-opacity-25 rounded-3 mt-2 mx-2">
                                <label class="small text-secondary mb-2">Yeni Tavan Tutarı (TL)</label>
                                <input type="text" class="form-control form-control-sm bg-transparent text-white border-secondary mb-3" id="yeniTavanDegeri" oninput="formatTutar(this)" placeholder="Örn: 35.058,58">
                                <button class="btn btn-outline-light btn-sm w-100 rounded-pill" onclick="guncelleKidemTavani()">
                                    Güncelle
                                </button>
                            </div>
                        </div>
                    </li>
                </ul>
            </div>

            <div class="mt-auto pt-4 border-top border-secondary border-opacity-25">
                <ul class="nav flex-column">
                    <li class="nav-item">
                        <a class="nav-link logout-link d-flex align-items-center" href="/admin/logout">
                            <i class="bi bi-box-arrow-right me-3 fs-5"></i>Çıkış Yap
                        </a>
                    </li>
                </ul>
            </div>

        </div>

    </div>
</div>

<div class="modal fade" id="mesajDetayModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content bg-dark border-secondary shadow">
            <div class="modal-header border-bottom-0 pb-0">
                <h5 class="modal-title fw-bold text-primary d-flex align-items-center">
                    <img src="logo/logo1.png" alt="Mercek AI" class="me-2" style="width: 24px; height: 24px;">
                    <span id="modalKonu">Konu</span>
                </h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Kapat"></button>
            </div>
            <div class="modal-body pt-3">
                <div class="p-3 mb-3 rounded-3" style="background-color: rgba(255,255,255,0.05);">
                    <p class="mb-1 text-white"><strong>Gönderen:</strong> <span id="modalAd" class="text-light"></span></p>
                    <p class="mb-1 text-white"><strong>E-posta:</strong> <span id="modalEposta" class="text-light"></span></p>
                    <p class="mb-0 text-secondary small"><strong>Tarih:</strong> <span id="modalTarih"></span></p>
                </div>
                <div class="p-3 border border-secondary rounded-3" style="background-color: #1a1d21;">
                    <p class="mb-0 text-light" id="modalMesaj" style="white-space: pre-wrap; font-size:0.95rem;"></p>
                </div>
            </div>
            <div class="modal-footer border-top-0 pt-0">
                <button type="button" class="btn btn-secondary rounded-pill px-4" data-bs-dismiss="modal">Kapat</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/y-script.js"></script>

</body>
</html>
